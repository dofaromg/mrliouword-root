name = "mrl-status"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Cron: 每 5 分鐘做一次健康檢查
[triggers]
crons = ["*/5 * * * *"]

# 部署前先建立 KV namespace 並填入 id：
#   wrangler kv namespace create STATUS_KV
[[kv_namespaces]]
binding = "STATUS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# 綁定 status.mrliouword.com（zone 需在同一帳號）
[[routes]]
pattern = "status.mrliouword.com/*"
zone_name = "mrliouword.com"
