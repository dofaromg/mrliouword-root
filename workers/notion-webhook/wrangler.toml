name = "mrliouword-root"
main = "src/index.js"
compatibility_date = "2026-08-01"

# 開啟 Workers Logs(存留日誌),方便讀 Notion 握手 token / 除錯
[observability]
enabled = true

# ── 事件記錄 / 去重 / 死信 / 握手 token 暫存 KV(MRL_EVENTS)──
[[kv_namespaces]]
binding = "EVENTS_KV"
id = "b907464a6f7f47229b844fe95f442e03"

# ── 可選:綁自訂網域路由 ──
# [[routes]]
# pattern = "notion-hook.mrliouword.com/*"
# zone_name = "mrliouword.com"

# 註:機密請用 Secrets Store / `wrangler secret put`，勿寫在此檔:
#   NOTION_WEBHOOK_SECRET  Notion 握手給的 verification_token
#   FORWARD_URL            (可選) 事件轉發目的地
