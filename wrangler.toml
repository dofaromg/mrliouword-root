# MRL 根層部署設定(mrliouword-root Cloudflare Workers Build 用)
# 讓 `npx wrangler deploy` 在專案根目錄 `/` 就能部署 Notion webhook worker,
# 不必手動把 Cloudflare 專案根目錄改成 workers/notion-webhook。
#
# 機密請走 Secrets Store / `npx wrangler secret put`,勿寫在此檔:
#   NOTION_WEBHOOK_SECRET  Notion 握手給的 verification_token
#   FORWARD_URL            (可選) 事件轉發目的地
#   STRIPE_WEBHOOK_SECRET  Stripe webhook 端點簽章密鑰(whsec_…),收帳入口 POST /stripe/webhook 用
#   MRL_HANDSHAKE_KEY      操作者金鑰:一次性取 Notion 握手 token、讀帳本 GET /ledger/payments
name = "mrliouword-root"
main = "workers/notion-webhook/src/index.js"
compatibility_date = "2026-08-01"
# 加了 routes 之後 wrangler 預設會關掉 workers.dev 子網域;明確保留它:
# Stripe webhook(…/stripe/webhook)、health、/pricing 的備援網址都在 workers.dev 上。
workers_dev = true

# 開啟 Workers Logs(存留日誌),方便讀 Notion 握手 token / 除錯
[observability]
enabled = true

# ── 事件記錄 / 去重 / 死信 / 握手 token 暫存 KV ──
# 不填 id:由 wrangler 自動佈建(wrangler ≥4.45),部署時在「部署所用的帳號」建立並綁定,
# 之後的部署會沿用同一個 namespace。這避免在別的帳號手動建 KV 造成 10041 not found。
# 建好的 id 可在 Cloudflare 儀表板 → 儲存 → KV 查看;要固定下來時再回填 id。
[[kv_namespaces]]
binding = "EVENTS_KV"

# ── 定價頁路由:mrliouword.com/pricing 由本 worker 提供 ──
# 比既有官網 worker 的 `mrliouword.com/*` 更精確,Cloudflare 以最精確路由優先,不影響首頁。
# 需要部署用的 token 有該 zone 的 Workers Routes 權限;失敗時 build log 會顯示,屆時改在儀表板手動加路由。
[[routes]]
pattern = "mrliouword.com/pricing*"
zone_name = "mrliouword.com"

[[routes]]
pattern = "www.mrliouword.com/pricing*"
zone_name = "mrliouword.com"
